name: Release

# Tag push is the primary trigger. Also runnable manually (workflow_dispatch)
# for environments that can drive the GitHub Actions API but can't push a tag
# ref (e.g. a scoped CI bot token) — tauri-action's `tagName` below creates
# the tag itself, pointed at whatever ref the manual run used, if it doesn't
# already exist. Same pattern as developer-desktop-util-plugin's release.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (e.g. v0.9.0)'
        required: true
        type: string

# Least privilege at the top level: the only job here declares the write scopes
# it actually needs (contents/id-token/attestations). Anything added later
# starts read-only and has to opt in explicitly.
permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
          # - platform: ubuntu-22.04-arm
          #   args: ''
          #   rust-target: ''
          # - platform: macos-latest      # ARM runner — cross-compiles x86_64 (no Intel runner queue)
          #   args: '--target x86_64-apple-darwin'
          #   rust-target: x86_64-apple-darwin
          - platform: macos-latest      # ARM runner — native aarch64 build
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          # windows-latest again: this job used to be pinned to windows-2022
          # because Server 2025 broke WiX v3's light.exe for the msi target. msi
          # is dropped now (see tauri.conf.json's bundle.targets — WiX v3 is
          # archived and its VBScript dependency is unfixable in CI), and NSIS
          # has no known issue on windows-latest. This also matches
          # build-cache.yml's matrix, so the Rust cache this job restores
          # (shared-key: ${{ matrix.platform }}-...) is finally the one that
          # workflow actually warms, instead of a key nothing else writes to.
          - platform: windows-latest
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    # Bundling + signing + attestation on three platforms.
    timeout-minutes: 90

    permissions:
      contents: write      # publish the release and upload assets
      id-token: write      # OIDC token used to sign the provenance attestation
      attestations: write  # write the attestation to the repo's attestation store

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags so the changelog can diff previous→new tag

      - name: Resolve release tag (workflow_dispatch input, or the pushed tag)
        # shell: bash — the default shell on windows-latest is pwsh, where
        # "$GITHUB_ENV" doesn't expand to the env-file path the way it does
        # in bash, so the append silently no-ops. Confirmed the hard way:
        # v0.9.0's first release run left RELEASE_TAG empty on Windows only
        # (macOS/Linux default to bash already), producing an empty VERSION
        # ("Could not determine package name and version.") and a published
        # release entirely missing Windows installers.
        shell: bash
        run: echo "RELEASE_TAG=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_ENV"

      # Derive the app version from the tag (e.g. v0.2.4 -> 0.2.4) and write
      # it into the config files, so you only have to push a tag — no manual version
      # bump in tauri.conf.json. tauri-action reads the version from tauri.conf.json.
      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Setting version to $VERSION"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='package.json',j=require('./'+f);j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs'),f='src-tauri/Cargo.toml';let c=fs.readFileSync(f,'utf8');c=c.replace(/^version = \".*\"/m,'version = \"$VERSION\"');fs.writeFileSync(f,c)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          shared-key: ${{ matrix.platform }}-${{ matrix.rust-target }}
          # Restore only. The cache is created/refreshed by build-cache.yml on main;
          # a tag run can read main's cache but would otherwise save a tag-scoped
          # copy that no future tag can reuse, so we never save here.
          save-if: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Build the release notes from the full commit log between the previous tag
      # and this tag. This becomes both the GitHub release body AND the updater
      # manifest `notes` field, so the in-app update popup shows the real changes.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          NEW_TAG="${RELEASE_TAG}"
          # Nearest tag reachable from HEAD's parent = the previous release.
          # HEAD^ instead of "${NEW_TAG}^": on a tag push, HEAD already IS the
          # tag's commit (that's what triggered the checkout) so they're the
          # same thing — but on workflow_dispatch, NEW_TAG doesn't exist as a
          # git ref yet (tauri-action creates it later), so "${NEW_TAG}^"
          # would fail to resolve while HEAD^ still works.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"           # first release — list the whole history
          fi

          # Every commit in the range (excluding merge commits), as "- subject (hash)".
          commits=$(git log --no-merges --pretty=format:'- (%h) %s ' "$RANGE")
          [ -z "$commits" ] && commits="- No changes recorded."

          {
            echo "RELEASE_NOTES<<__NOTES_EOF__"
            echo "## Changes:"
            echo "$commits"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_ENV"

      # Windows bundling downloads NSIS (and nsis_tauri_utils.dll) into
      # %LOCALAPPDATA%\tauri on every run. Cache that dir so later releases reuse it.
      - name: Cache Tauri bundler tools (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-bundler-

      # Best-effort: cache Tauri's downloaded bundler tooling on Linux (AppImage
      # linuxdeploy/AppRun + plugins). Depending on the Tauri version these may be
      # fetched into the build dir instead, in which case this is a harmless no-op.
      # - name: Cache Tauri bundler tools (Linux)
      #   if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: |
      #       ~/.cache/tauri
      #       ~/.local/share/tauri
      #     key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/Cargo.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-tauri-bundler-

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: DevTool ${{ env.RELEASE_TAG }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          # Must be published (not draft) for the updater: the endpoint
          # releases/latest/download/latest.json only resolves to the latest
          # PUBLISHED release, so drafts are invisible to the in-app updater.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # ── Verifiable supply chain ─────────────────────────────────────────
      # Everything below turns "trust us" into something a user can check with
      # `gh attestation verify` / `shasum -c`. See SECURITY.md and
      # scripts/verify-release.sh.

      - name: Collect built artifact paths
        id: artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          # tauri-action reports the bundles it produced as a JSON array.
          # Keep only the installers/bundles: the .sig files are already covered
          # by the updater's own minisign signature.
          node -e '
            const paths = JSON.parse(process.env.ARTIFACT_PATHS || "[]")
              .filter((p) => !p.endsWith(".sig"));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              `paths<<__EOF__\n${paths.join("\n")}\n__EOF__\n`);
            console.log(paths.join("\n"));
          '

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      - name: Publish SHA256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_LIST: ${{ steps.artifacts.outputs.paths }}
        run: |
          set -euo pipefail
          sums="SHA256SUMS-${{ matrix.platform }}${{ matrix.rust-target && format('-{0}', matrix.rust-target) || '' }}.txt"
          : > "$sums"
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            [ -f "$artifact" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")")
            else
              (cd "$(dirname "$artifact")" && shasum -a 256 "$(basename "$artifact")")
            fi >> "$sums"
          done <<< "$ARTIFACT_LIST"
          cat "$sums"
          gh release upload "${RELEASE_TAG}" "$sums" --clobber --repo "${GITHUB_REPOSITORY}"

      # One SBOM per release is enough — the dependency tree is the same on
      # every platform, so only the Linux job publishes it.
      - name: Generate SBOM
        if: matrix.platform == 'ubuntu-22.04'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: devtool-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish SBOM
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" devtool-sbom.spdx.json --clobber --repo "${GITHUB_REPOSITORY}"
