name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege at the top level: the only job here declares the write scopes
# it actually needs (contents/id-token/attestations). Anything added later
# starts read-only and has to opt in explicitly.
permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
          # - platform: ubuntu-22.04-arm
          #   args: ''
          #   rust-target: ''
          # - platform: macos-latest      # ARM runner — cross-compiles x86_64 (no Intel runner queue)
          #   args: '--target x86_64-apple-darwin'
          #   rust-target: x86_64-apple-darwin
          - platform: macos-latest      # ARM runner — native aarch64 build
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    # Bundling + signing + attestation on three platforms.
    timeout-minutes: 90

    permissions:
      contents: write      # publish the release and upload assets
      id-token: write      # OIDC token used to sign the provenance attestation
      attestations: write  # write the attestation to the repo's attestation store

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags so the changelog can diff previous→new tag

      # Derive the app version from the pushed tag (e.g. v0.2.4 -> 0.2.4) and write
      # it into the config files, so you only have to push a tag — no manual version
      # bump in tauri.conf.json. tauri-action reads the version from tauri.conf.json.
      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='package.json',j=require('./'+f);j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs'),f='src-tauri/Cargo.toml';let c=fs.readFileSync(f,'utf8');c=c.replace(/^version = \".*\"/m,'version = \"$VERSION\"');fs.writeFileSync(f,c)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          shared-key: ${{ matrix.platform }}-${{ matrix.rust-target }}
          # Restore only. The cache is created/refreshed by build-cache.yml on main;
          # a tag run can read main's cache but would otherwise save a tag-scoped
          # copy that no future tag can reuse, so we never save here.
          save-if: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Build the release notes from the full commit log between the previous tag
      # and this tag. This becomes both the GitHub release body AND the updater
      # manifest `notes` field, so the in-app update popup shows the real changes.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          NEW_TAG="${GITHUB_REF_NAME}"
          # Nearest tag reachable from this tag's parent = the previous release.
          PREV_TAG=$(git describe --tags --abbrev=0 "${NEW_TAG}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${NEW_TAG}"
          else
            RANGE="${NEW_TAG}"           # first release — list the whole history
          fi

          # Every commit in the range (excluding merge commits), as "- subject (hash)".
          commits=$(git log --no-merges --pretty=format:'- (%h) %s ' "$RANGE")
          [ -z "$commits" ] && commits="- No changes recorded."

          {
            echo "RELEASE_NOTES<<__NOTES_EOF__"
            echo "## Changes:"
            echo "$commits"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_ENV"

      # WiX v3's light.exe (used for the .msi bundle) depends on the VBScript
      # engine. Recent windows-latest runner images ship VBSCRIPT as an
      # optional Feature-on-Demand that is no longer installed by default, so
      # light.exe fails to even launch ("failed to run ...\light.exe").
      # Installing the capability restores it. See:
      # https://v2.tauri.app/distribute/windows-installer/
      - name: Enable VBScript (required by WiX msi bundler)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Add-WindowsCapability -Online -Name "VBSCRIPT~~~~"

      # Windows bundling downloads WiX + NSIS (and nsis_tauri_utils.dll) into
      # %LOCALAPPDATA%\tauri on every run. Cache that dir so later releases reuse it.
      - name: Cache Tauri bundler tools (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-bundler-

      # Best-effort: cache Tauri's downloaded bundler tooling on Linux (AppImage
      # linuxdeploy/AppRun + plugins). Depending on the Tauri version these may be
      # fetched into the build dir instead, in which case this is a harmless no-op.
      # - name: Cache Tauri bundler tools (Linux)
      #   if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
      #   uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #   with:
      #     path: |
      #       ~/.cache/tauri
      #       ~/.local/share/tauri
      #     key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/Cargo.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-tauri-bundler-

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DevTool ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          # Must be published (not draft) for the updater: the endpoint
          # releases/latest/download/latest.json only resolves to the latest
          # PUBLISHED release, so drafts are invisible to the in-app updater.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # ── Verifiable supply chain ─────────────────────────────────────────
      # Everything below turns "trust us" into something a user can check with
      # `gh attestation verify` / `shasum -c`. See SECURITY.md and
      # scripts/verify-release.sh.

      - name: Collect built artifact paths
        id: artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          # tauri-action reports the bundles it produced as a JSON array.
          # Keep only the installers/bundles: the .sig files are already covered
          # by the updater's own minisign signature.
          node -e '
            const paths = JSON.parse(process.env.ARTIFACT_PATHS || "[]")
              .filter((p) => !p.endsWith(".sig"));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              `paths<<__EOF__\n${paths.join("\n")}\n__EOF__\n`);
            console.log(paths.join("\n"));
          '

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      - name: Publish SHA256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_LIST: ${{ steps.artifacts.outputs.paths }}
        run: |
          set -euo pipefail
          sums="SHA256SUMS-${{ matrix.platform }}${{ matrix.rust-target && format('-{0}', matrix.rust-target) || '' }}.txt"
          : > "$sums"
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            [ -f "$artifact" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")")
            else
              (cd "$(dirname "$artifact")" && shasum -a 256 "$(basename "$artifact")")
            fi >> "$sums"
          done <<< "$ARTIFACT_LIST"
          cat "$sums"
          gh release upload "${GITHUB_REF_NAME}" "$sums" --clobber --repo "${GITHUB_REPOSITORY}"

      # One SBOM per release is enough — the dependency tree is the same on
      # every platform, so only the Linux job publishes it.
      - name: Generate SBOM
        if: matrix.platform == 'ubuntu-22.04'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: devtool-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish SBOM
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" devtool-sbom.spdx.json --clobber --repo "${GITHUB_REPOSITORY}"
