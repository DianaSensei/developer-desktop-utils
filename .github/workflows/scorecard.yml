# OpenSSF Scorecard — a third-party security grade for this repository.
#
# Results are published to https://scorecard.dev/viewer/?uri=github.com/DianaSensei/developer-desktop-utils
# and surfaced as the badge in README.md, so anyone can audit the score's
# breakdown without taking our word for anything.
#
# Structure follows the upstream reference workflow (ossf/scorecard). Scorecard
# rejects workflows with top-level env vars, defaults, or write permissions, and
# only allows a fixed set of actions — keep it that way when editing.
name: Scorecard

on:
  push:
    # Only the default branch is supported.
    branches: [main]
  schedule:
    # Weekly, Saturday 01:30 UTC.
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the SARIF to the Code scanning dashboard
      id-token: write         # OIDC token, required by publish_results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for the public viewer page and the README badge. It also
          # spares the Scorecard team from re-scanning this repo themselves.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
