name: Security

# Docs-only changes touch neither npm/Cargo dependencies nor secrets, so skip
# the per-push/PR run for them; the monthly schedule below still gives a full
# scan a cadence independent of what commits happen to land.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore: *docs-only
  schedule:
    # Monthly, 1st at 03:00 UTC — catches advisories published against
    # dependencies that haven't otherwise changed since the last commit.
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Known-vulnerable npm packages ────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      # Fail the build on high/critical advisories; moderate ones are reported
      # in the log so they are visible without blocking every PR.
      - name: Report all advisories
        run: npm audit --audit-level=moderate || true
      - name: Fail on high/critical
        run: npm audit --audit-level=high

  # ── Known-vulnerable Rust crates (RustSec advisory DB) ───────────────────
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-audit
      # `cargo audit` fails on vulnerabilities; unmaintained/unsound/yanked
      # notices are reported as warnings and do not block (`--deny warnings`
      # would, and those crates come from tauri/lapin/glib — not ours to fix).
      #
      # Ignored advisories — each with why it is not exploitable here.
      # Remove an entry as soon as a compatible fix reaches Cargo.lock.
      #
      # RUSTSEC-2026-0367 / 0368 / 0369 — `zip` 4.x: extraction honours
      # SUID/SGID bits, symlink targets and permissions through symlinks
      # outside the destination. No fix in zip 4.x (fixed in 9.0), and `zip`
      # reaches us only through tauri-plugin-updater 2.x, which pins `^4`
      # (still so in 2.14.0; only 3.0 alphas move on). Its one use is
      # `extract_zip`, Windows-only, on an update package that `Update::verify`
      # has already checked against the minisign public key pinned in
      # tauri.conf.json — so an attacker-chosen archive needs our release
      # signing key, at which point they can ship any binary anyway. The
      # SUID/SGID and Unix-permission advisories do not apply on Windows.
      # Drop these three once a 2.x updater depends on zip >= 9.
      - name: Audit Cargo.lock
        working-directory: src-tauri
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0367
          --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369

  # NOTE: CodeQL is not run from this workflow — see .github/workflows/codeql.yml
  # (Advanced Setup, replacing the old GitHub-managed "default setup": cached
  # Rust builds, a concurrency group, and path-filtered PR runs instead of a
  # config-less scan on every PR push and every resulting main push).

  # ── Leaked credentials, in the tree and in history ───────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history on the scheduled run; a shallow tree is enough per-push.
          # Quoted deliberately: GitHub expressions treat the number 0 as FALSY,
          # so an unquoted `... && 0 || 1` collapses to 1 on BOTH branches and
          # the scheduled deep-history scan silently never happened.
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          extra_args: --results=verified

  # ── Block risky dependency changes at review time ────────────────────────
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Publish an SBOM of the full dependency tree ──────────────────────────
  # push:main/schedule only: this just uploads an artifact, it doesn't gate
  # anything, so a PR commit doesn't need its own SBOM — the one from the
  # last main push (or the monthly run) is what anyone auditing the tree
  # actually wants, and re-generating it on every PR push was pure waste.
  sbom:
    name: SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SPDX SBOM (npm + Cargo)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: devtool-sbom.spdx.json
          output-file: devtool-sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: devtool-sbom.spdx.json

  # ── The claims in SECURITY.md, asserted as a test ────────────────────────
  claims:
    name: Verify SECURITY.md claims
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the documented guarantees still hold
        run: ./scripts/check-security-claims.sh
