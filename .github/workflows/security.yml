name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 03:00 UTC — catches advisories published after the last commit.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Known-vulnerable npm packages ────────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      # Fail the build on high/critical advisories; moderate ones are reported
      # in the log so they are visible without blocking every PR.
      - name: Report all advisories
        run: npm audit --audit-level=moderate || true
      - name: Fail on high/critical
        run: npm audit --audit-level=high

  # ── Known-vulnerable Rust crates (RustSec advisory DB) ───────────────────
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-audit
      # `cargo audit` fails on vulnerabilities; unmaintained/unsound/yanked
      # notices are reported as warnings and do not block (`--deny warnings`
      # would, and those crates come from tauri/lapin/glib — not ours to fix).
      #
      # No `--ignore` entries: the tree is clean of vulnerabilities. The two
      # quick-xml denial-of-service advisories (RUSTSEC-2026-0194/0195) that
      # used to be ignored here are fixed — `plist` 1.10 adopted quick-xml
      # 0.41, so the lockfile carries the fixed version. Keep this list empty;
      # if a new advisory has no reachable fix, add it back with a comment
      # saying why it is not exploitable here.
      - name: Audit Cargo.lock
        working-directory: src-tauri
        run: cargo audit

  # NOTE: CodeQL is not run from this workflow. The repository has CodeQL
  # "default setup" enabled, which already analyses javascript-typescript, rust,
  # actions, python and java-kotlin — broader coverage than an advanced config
  # here would give. GitHub refuses SARIF from an advanced configuration while
  # default setup is on, so a job here could only ever fail. Manage CodeQL in
  # Settings -> Code security.

  # ── Leaked credentials, in the tree and in history ───────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history on the scheduled run; a shallow tree is enough per-push.
          # Quoted deliberately: GitHub expressions treat the number 0 as FALSY,
          # so an unquoted `... && 0 || 1` collapses to 1 on BOTH branches and
          # the scheduled deep-history scan silently never happened.
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }}
      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          extra_args: --results=verified

  # ── Block risky dependency changes at review time ────────────────────────
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Publish an SBOM of the full dependency tree ──────────────────────────
  sbom:
    name: SBOM
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SPDX SBOM (npm + Cargo)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: devtool-sbom.spdx.json
          output-file: devtool-sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: devtool-sbom.spdx.json

  # ── The claims in SECURITY.md, asserted as a test ────────────────────────
  claims:
    name: Verify SECURITY.md claims
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the documented guarantees still hold
        run: ./scripts/check-security-claims.sh
