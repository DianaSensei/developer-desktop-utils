name: Build cache (deps)

# Refreshes the Rust dependency cache on the default branch (main) so that tag
# releases (release.yml) restore it and build fast.
#
# Why this exists: GitHub scopes Actions caches per ref. A tag run can read the
# DEFAULT BRANCH's cache, but two different tags cannot read each other's. So the
# cache has to be created on main. Swatinem/rust-cache keys the cache on the
# Cargo.lock hash, so it only needs refreshing when dependencies change — which
# is exactly when this runs. Ordinary pushes (frontend, Rust logic, docs) touch
# neither file and trigger nothing. No cron.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/Cargo.toml'
  workflow_dispatch: {} # manual refresh if you ever need it

# Cancel an in-progress run if a newer one starts.
concurrency:
  group: build-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-target: ''
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    # Cold cross-platform Tauri builds; observed worst 13.8 min.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup shared with release.yml/coverage.yml — see
      # .github/actions/setup-tauri-env. Same shared-key as release.yml so
      # the cache this saves is the exact cache the tag release restores
      # (default cache-save-if: 'true' — this is the job that refreshes it).
      - name: Setup build environment
        uses: ./.github/actions/setup-tauri-env
        with:
          rust-target: ${{ matrix.rust-target }}
          cache-shared-key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (no bundle)
        run: npm run tauri -- build --no-bundle ${{ matrix.rust-target && format('--target {0}', matrix.rust-target) || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
