name: Coverage

# Docs-only changes can't move the Rust/frontend coverage numbers, so skip
# this workflow for them — it's the most expensive one here (Tauri system
# deps + a full Rust build), not worth paying for a README edit.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore: *docs-only

permissions:
  contents: read

# The most expensive workflow here, and the only one that had no concurrency
# group: every push to a PR branch started another Rust build while the previous
# one was still running. Superseded PR runs are cancelled; runs on main are not,
# so Codecov keeps a complete baseline for the default branch.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-22.04
    # Observed median 3 min, worst 7.5 min. The default is 360, so a job wedged
    # on a network stall would otherwise hold a concurrency slot for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Rust bin crate embeds the frontend via `generate_context!`, which
      # reads `frontendDist` (../dist) at compile time. Build the frontend first
      # so the crate (and therefore its tests) compiles.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (creates ../dist for generate_context!)
        run: npm run build

      # Tauri's system dependencies — same set the release build uses.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          components: llvm-tools-preview

      # GitHub scopes Actions caches per ref: a PR can RESTORE the default
      # branch's cache, but a cache it SAVES is visible only to that PR branch
      # (never to other PRs or main). Saving on every PR therefore mints large,
      # un-shareable, instrumented-build caches that just churn the 10 GB limit
      # and evict main's useful one. So only main saves; PRs restore-only.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lcov --output-path lcov.info

      # cargo-llvm-cov writes absolute SF: paths. Strip the workspace prefix so
      # they become repo-relative (src-tauri/src/...) and Codecov can map them to
      # files in the commit — otherwise the report is "unusable" (path mismatch).
      - name: Normalize report paths to repo root
        run: sed -i "s|${GITHUB_WORKSPACE}/||g" lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
