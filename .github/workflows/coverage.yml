name: Coverage

# Two independent jobs, one Codecov upload each under its own flag (see
# codecov.yml): `frontend` (vitest, Node-only) and `rust` (cargo-llvm-cov,
# the expensive one — Tauri system deps + a full Rust build). Both share the
# same paths-ignore below since neither can move on a docs-only/script-only
# change: docs, the local docker-compose fixtures used for manual
# Kafka/RabbitMQ testing, and the one-off maintenance scripts (icon gen,
# release verification, MCP-sidecar prep for the desktop build — not the
# `npm run build` the rust job runs to embed the frontend).
on:
  push:
    branches: [main]
    paths-ignore: &coverage-irrelevant
      - '**/*.md'
      - 'docs/**'
      - 'testing/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
  pull_request:
    paths-ignore: *coverage-irrelevant

permissions:
  contents: read

# The most expensive workflow here, and the only one that had no concurrency
# group: every push to a PR branch started another Rust build while the previous
# one was still running. Superseded PR runs are cancelled; runs on main are not,
# so Codecov keeps a complete baseline for the default branch.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Node-only, no Tauri system deps/Rust toolchain — reports in well under a
  # minute, independent of the Rust job below. Uploaded under its own
  # `frontend` flag (see codecov.yml) so it shows as a separate component
  # from the Rust coverage, instead of one number that mixes two languages'
  # very different testability.
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      - name: Generate coverage (lcov, vitest.config.ts's existing coverage block)
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  rust:
    runs-on: ubuntu-22.04
    # Observed median 3 min, worst 7.5 min. The default is 360, so a job wedged
    # on a network stall would otherwise hold a concurrency slot for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup shared with release.yml/build-cache.yml — see
      # .github/actions/setup-tauri-env (Node, Rust + llvm-tools-preview,
      # Linux system deps, npm ci). GitHub scopes Actions caches per ref: a
      # PR can RESTORE the default branch's cache, but a cache it SAVES is
      # visible only to that PR branch — saving on every PR would mint
      # large, un-shareable, instrumented-build caches that just churn the
      # 10 GB limit and evict main's useful one. So only main saves.
      - name: Setup build environment
        uses: ./.github/actions/setup-tauri-env
        with:
          rust-components: llvm-tools-preview
          cache-shared-key: coverage
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Rust bin crate embeds the frontend via `generate_context!`, which
      # reads `frontendDist` (../dist) at compile time. Needed before the
      # first `cargo`/`cargo llvm-cov` invocation below.
      - name: Build frontend (creates ../dist for generate_context!)
        run: npm run build

      # tauri-build's build.rs checks that every `bundle.externalBin` resource
      # (tauri.conf.json) exists on disk, even for a plain `cargo test`/`cargo
      # llvm-cov` that never bundles anything — normally `beforeBuildCommand`
      # (npm run build:mcp-sidecar / build:service-sidecars) produces the real
      # binaries, but this job only builds the frontend, so `cargo` fails at
      # the very first build-script run with "resource path ... doesn't exist".
      # Coverage doesn't run these sidecars, only compiles their crate — empty
      # placeholders named exactly like the real target-triple-suffixed
      # binaries satisfy the resource check without the cost of a real build.
      - name: Placeholder externalBin resources (coverage doesn't run sidecars, just needs them to exist)
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          touch "src-tauri/binaries/devtool-mcp-server-$triple" "src-tauri/binaries/devtool-svc-echo-$triple"
          chmod +x src-tauri/binaries/devtool-mcp-server-"$triple" src-tauri/binaries/devtool-svc-echo-"$triple"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lcov --output-path lcov.info

      # cargo-llvm-cov writes absolute SF: paths. Strip the workspace prefix so
      # they become repo-relative (src-tauri/src/...) and Codecov can map them to
      # files in the commit — otherwise the report is "unusable" (path mismatch).
      - name: Normalize report paths to repo root
        run: sed -i "s|${GITHUB_WORKSPACE}/||g" lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
