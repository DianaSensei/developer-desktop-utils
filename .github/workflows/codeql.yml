name: CodeQL

# Advanced Setup, replacing GitHub's CodeQL "default setup" (see the removed
# comment in security.yml). Default setup gave two problems with no way to
# fix them because it isn't a file in this repo: every push to a PR queued a
# second full scan on top of the first because there was no concurrency
# group to cancel it, and the same commit got scanned twice — once as the PR
# head, once again as the resulting push to main.
#
# IMPORTANT — this workflow only takes effect once CodeQL "default setup" is
# turned off: Settings -> Code security and analysis -> CodeQL analysis ->
# Set up -> Advanced (or Disable, since this file now covers it). GitHub
# refuses to accept SARIF uploads from an advanced-configuration workflow
# while default setup is still enabled, so this workflow's runs will show a
# red X here until that switch is flipped by hand — no gh/API call available
# from this session — before or immediately after merging.
on:
  push:
    branches: [main]
    paths-ignore: &codeql-irrelevant
      - '**/*.md'
      - 'docs/**'
      - 'testing/**'
  pull_request:
    paths-ignore: *codeql-irrelevant
  schedule:
    # Weekly rather than default setup's own cadence — advisories that land
    # against unchanged dependencies are already covered on the same cadence
    # as security.yml's cargo-audit/npm-audit schedule's sibling monthly
    # scan; weekly here just keeps CodeQL's own query packs fresh sooner.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every language is analyzed on every PR (docs-only changes are skipped by
  # `paths-ignore` above). This used to gate each language on whether the PR
  # touched it, but code scanning compares a PR against every configuration
  # (`category`) present on main: a PR that skipped one — e.g. no `.github/`
  # change, so no `/language:actions` — gets a neutral "1 configuration not
  # found" CodeQL check, and the repository ruleset's code-scanning rule then
  # keeps the PR blocked even with every other check green (PRs #204, #207
  # and #208 all had to be merged by hand). The three jobs run in parallel;
  # actions and javascript-typescript take about a minute, rust about nine.
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:actions'

  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:javascript-typescript'

  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CodeQL's Rust extractor only supports build-mode: none (confirmed by
      # a failed run: "Rust does not support the manual build mode. Please
      # try ... none") — but that's NOT source-only parsing: per GitHub's
      # docs, rust-analyzer still compiles and runs build.rs scripts and
      # compiles proc-macro code (it only skips the full crate build), into
      # a fresh, uncached cargo_target_dir every run. So this job doesn't
      # need coverage.yml's rust job's full cached-build sequence
      # (setup-tauri-env, npm run build, externalBin placeholders, cargo
      # build) — those exist only for an actual `cargo`/tauri-build
      # invocation — but it's still heavier than the actions/js-ts jobs,
      # which is why its timeout stays above theirs.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:rust'
