name: Release (canary)

# Kênh phát hành THỨ HAI, song song với release.yml — dùng để thử nghiệm kiến
# trúc Platform/Plugin mới (Tier B, cài sidecar từ URL, v.v.) với một nhóm
# người dùng trước khi thay hẳn bản ổn định.
#
# CÁCH LY VỚI KÊNH ỔN ĐỊNH, có chủ ý ở BA lớp:
#   1. Tag pattern riêng (`canary-v*`) — không đụng gì tới trigger `v*` của
#      release.yml.
#   2. `identifier`/`productName` riêng (src-tauri/tauri.canary.conf.json, hợp
#      nhất đè lên tauri.conf.json qua `--config`) — app cài song song trên
#      cùng máy, app_data (secrets/store/plugin-data/service-data) tách biệt
#      hoàn toàn, không đè lên bản ổn định.
#   3. Endpoint updater riêng, trỏ vào một tag GitHub Release CỐ ĐỊNH
#      (`canary-latest`), KHÔNG dùng alias `releases/latest/` — alias đó luôn
#      trỏ bản release mới nhất trong CẢ REPO bất kể kênh nào, nên nếu canary
#      dùng chung alias thì người dùng bản ổn định sẽ bị đề nghị cập nhật lên
#      bản đang thử nghiệm.
#
# Tag `canary-latest` bị XOÁ VÀ TẠO LẠI mỗi lần chạy (rolling release) — ý
# định là "bản canary mới nhất luôn có" chứ không giữ lịch sử nhiều bản canary
# cũ trên GitHub Releases. Lịch sử thật nằm ở git tag `canary-vX.Y.Z...` đã
# push, không mất đi khi release bị xoá tạo lại.

on:
  push:
    tags:
      - 'canary-v*'

permissions:
  contents: read

jobs:
  # Job RIÊNG, chạy MỘT LẦN trước matrix — ba job platform bên dưới publish
  # đồng thời (song song, giống release.yml), nên nếu mỗi job tự xoá+tạo lại
  # `canary-latest` trong THÂN matrix, ba job sẽ giẫm lên nhau (job A xoá đúng
  # lúc job B đang upload asset vào release mà job A vừa xoá). Tách reset ra
  # một job riêng, `needs:` matrix job đợi nó xong, mới không có race.
  reset-canary-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Reset rolling canary-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete canary-latest --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true

  publish:
    needs: reset-canary-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            rust-target: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Tag thật là `canary-v1.2.0` (hoặc bất kỳ hậu tố nào sau `canary-v`) —
      # bóc đúng phần version để ghi vào tauri.conf.json/package.json/Cargo.toml,
      # KHÁC cách bóc của release.yml (`#v`) vì tiền tố ở đây dài hơn.
      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#canary-v}"
          echo "Setting version to $VERSION"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='package.json',j=require('./'+f);j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs'),f='src-tauri/Cargo.toml';let c=fs.readFileSync(f,'utf8');c=c.replace(/^version = \".*\"/m,'version = \"$VERSION\"');fs.writeFileSync(f,c)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # Clé riêng cho canary: identifier khác nên Cargo.toml version string
          # đổi theo một lịch khác hẳn kênh ổn định — chia sẻ cache với
          # release.yml chỉ tổ invalidation lẫn nhau không cần thiết.
          shared-key: canary-${{ matrix.platform }}-${{ matrix.rust-target }}
          save-if: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          NEW_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'canary-v*' "${NEW_TAG}^" 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${NEW_TAG}"
          else
            RANGE="${NEW_TAG}"
          fi

          commits=$(git log --no-merges --pretty=format:'- (%h) %s ' "$RANGE")
          [ -z "$commits" ] && commits="- No changes recorded."

          {
            echo "RELEASE_NOTES<<__NOTES_EOF__"
            echo "## Changes (canary):"
            echo "$commits"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_ENV"

      - name: Cache Tauri bundler tools (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-bundler-

      - name: Build and publish canary release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Tag GitHub Release CỐ ĐỊNH — khác `github.ref_name` (tag git thật,
          # mang version) có chủ ý: đây chính là điều làm endpoint updater của
          # canary ổn định qua nhiều lần phát hành mà không cần đổi
          # tauri.canary.conf.json mỗi lần.
          tagName: canary-latest
          releaseName: DevTool Canary ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }} --config src-tauri/tauri.canary.conf.json

      - name: Collect built artifact paths
        id: artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node -e '
            const paths = JSON.parse(process.env.ARTIFACT_PATHS || "[]")
              .filter((p) => !p.endsWith(".sig"));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
              `paths<<__EOF__\n${paths.join("\n")}\n__EOF__\n`);
            console.log(paths.join("\n"));
          '

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

      - name: Publish SHA256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_LIST: ${{ steps.artifacts.outputs.paths }}
        run: |
          set -euo pipefail
          sums="SHA256SUMS-${{ matrix.platform }}${{ matrix.rust-target && format('-{0}', matrix.rust-target) || '' }}.txt"
          : > "$sums"
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            [ -f "$artifact" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")")
            else
              (cd "$(dirname "$artifact")" && shasum -a 256 "$(basename "$artifact")")
            fi >> "$sums"
          done <<< "$ARTIFACT_LIST"
          cat "$sums"
          gh release upload canary-latest "$sums" --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Generate SBOM
        if: matrix.platform == 'ubuntu-22.04'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: devtool-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish SBOM
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload canary-latest devtool-sbom.spdx.json --clobber --repo "${GITHUB_REPOSITORY}"
