name: 'Setup Tauri build environment'
description: >
  Node, Rust, the Rust build cache, and (on Linux) Tauri's system deps —
  the same five steps release.yml, build-cache.yml, and coverage.yml each
  used to repeat with identical bodies, kept in one place so pinned action
  SHAs and the apt package list only need updating once.

inputs:
  rust-target:
    description: 'Extra Rust target to install (matrix.rust-target), or empty for the host target'
    default: ''
  rust-components:
    description: 'Comma-separated rustup components, e.g. llvm-tools-preview'
    default: ''
  cache-shared-key:
    description: 'Swatinem/rust-cache shared-key — must match between the job that saves and the job(s) that restore'
    required: true
  cache-save-if:
    description: >
      Swatinem/rust-cache save-if. Restore-only jobs (release.yml's tag
      builds) pass 'false' — the cache is refreshed on main by
      build-cache.yml instead, so a tag run saving its own copy would
      never be reused by any other tag.
    default: 'true'
  install-frontend-deps:
    description: "Run 'npm ci'. Set to 'false' if the caller needs Rust/cache only."
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
        cache: npm

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      with:
        toolchain: stable
        targets: ${{ inputs.rust-target }}
        components: ${{ inputs.rust-components }}

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target
        cache-on-failure: true
        shared-key: ${{ inputs.cache-shared-key }}
        save-if: ${{ inputs.cache-save-if }}

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    # --ignore-scripts: SonarCloud flagged the bare `npm ci` (S4830-class —
    # "package manager scripts should not be executed during installation").
    # Safe here: package-lock.json's only `hasInstallScript` entry is
    # fsevents, an optional macOS-only file watcher used by `npm run dev`
    # — nothing this repo's CI (build/lint/test) ever touches. Verified
    # `npm ci --ignore-scripts` still installs cleanly and `tsc --noEmit`
    # still passes.
    - name: Install frontend dependencies
      if: inputs.install-frontend-deps == 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts
