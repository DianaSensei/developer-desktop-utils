[package]
name = "devtool"
version = "0.1.0"
description = "Developer Utilities Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha1 = "0.10"
md-5 = "0.10"
digest = "0.10"
rskafka = { version = "0.6", features = ["transport-tls"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tauri-plugin-opener = "2.5.4"
local-ip-address = "0.6"
hostname = "0.4"
netstat2 = "0.11"
sysinfo = "0.32"
axum = "0.8"
rhai = "1"
regex = "1"
# lapin 4 bundles its own async runtime (via async-rs) and is selected by feature
# (default-runtime = tokio), so the old external tokio-executor-trait /
# tokio-reactor-trait glue is gone — which also removes the reactor-trait version
# skew that broke the Windows build. Default features (rustls + tokio) cover our
# TLS + tokio usage.
lapin = "4"
futures-util = "0.3"
percent-encoding = "2"
base64 = "0.21"
redis = { version = "1.6.0", features = ["tokio-comp", "tls-rustls", "tokio-rustls-comp"] }
# Docker Engine API client (async, over Unix socket / Windows named pipe). Talks
# to any daemon exposing a docker-compatible socket: Docker Desktop, Colima
# (docker runtime), Rancher Desktop (moby), OrbStack, Podman (docker-compat).
bollard = "0.21"

[target.'cfg(unix)'.dependencies]
# Direct handles onto crates bollard already pulls in transitively (its own
# "pipe" feature depends on exactly these, at these versions — see
# container_tool.rs's `volume_sizes`) so we can issue one raw request over the
# same Unix socket `bollard::Docker` connects with. Needed because bollard's
# typed `SystemDataUsageResponse` model (this version) only exposes the
# aggregate df counters, not the per-volume `UsageData.Size` the raw JSON
# response actually carries.
hyperlocal = "0.9"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Thin LTO + parallel codegen units trade a little binary size/runtime perf
# for much faster release builds (fat LTO + codegen-units=1 serializes all
# codegen onto a single thread, which is very slow with heavy async deps
# like tokio/rskafka/axum/lapin in the dependency tree).
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
