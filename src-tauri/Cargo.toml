[package]
name = "devtool"
version = "0.1.0"
description = "Developer Utilities Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# src/bin/devtool-mcp-server.rs makes this crate build two binaries; without
# this, `cargo run` (what `tauri dev` shells out to) can't pick one.
default-run = "devtool"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
# Handles desktop-devtool-app://install links from the plugins page.
# single-instance (with "deep-link") forwards the URL to the running app;
# it must be registered before deep-link in main.rs.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
digest = "0.11"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tauri-plugin-opener = "2.5.4"
local-ip-address = "0.6"
hostname = "0.4"
netstat2 = "0.11"
sysinfo = "0.39"
axum = "0.8"
# "sync" makes Engine Send + Sync so mockserver.rs can share one instance.
rhai = { version = "1", features = ["sync"] }
regex = "1"
base64 = "0.23"
# MCP SDK, used only by the devtool-mcp-server bin. >=1.4 avoids
# GHSA-89vp-x53w-74fx (HTTP transport only; this bin uses stdio).
rmcp = { version = "3.3", features = ["transport-io"] }
# Secret vault key storage (src/secrets_vault.rs). The macOS store must be
# enabled explicitly, otherwise macOS falls back to the key file.
keyring = { version = "4", features = ["apple-native-keyring-store"] }
aes-gcm = "0.11"
# OS randomness for vault keys and nonces.
getrandom = { version = "0.4", features = ["std"] }
# Artifact downloads (src/artifact_installer.rs), straight to disk. 0.12 is
# the version tauri-plugin-http already pulls in.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# Streams a body without Content-Length in artifact_installer.rs tests.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Thin LTO with parallel codegen: much faster release builds for a small
# size/performance cost.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
