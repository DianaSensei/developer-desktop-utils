[package]
name = "devtool"
version = "0.1.0"
description = "Developer Utilities Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# src/bin/devtool-mcp-server.rs makes this crate build two binaries; without
# this, `cargo run` (what `tauri dev` shells out to) can't pick one.
default-run = "devtool"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
digest = "0.11"
rskafka = { version = "0.6", features = ["transport-tls"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tauri-plugin-opener = "2.5.4"
local-ip-address = "0.6"
hostname = "0.4"
netstat2 = "0.11"
sysinfo = "0.39"
axum = "0.8"
rhai = "1"
regex = "1"
base64 = "0.23"
# Official Rust MCP SDK — only used by the devtool-mcp-server bin target
# (src/bin/devtool-mcp-server.rs), never by the main app itself. "transport-io"
# adds the stdio transport on top of the default feature set. Pinned >=1.4:
# versions below that carry GHSA-89vp-x53w-74fx (a DNS-rebinding issue in
# rmcp's Streamable HTTP server transport) — unreachable here since this bin
# only ever uses the stdio transport, but GitHub's dependency review flags
# the crate version regardless of which transport feature is enabled.
rmcp = { version = "1.4", features = ["transport-io"] }
# Kho bí mật (src/secrets_vault.rs). keyring giữ KHOÁ mã hoá trong keychain của
# OS; mặc định của crate đã bật cửa hàng của Windows và secret-service của
# Linux, còn macOS phải bật tay — thiếu nó, bản macOS sẽ âm thầm rơi về đường
# dự phòng ghi khoá ra file thay vì dùng Keychain.
keyring = { version = "4", features = ["apple-native-keyring-store"] }
aes-gcm = "0.11"
# Lấy ngẫu nhiên từ OS cho khoá và nonce. Dùng thẳng getrandom thay vì `rand`:
# ở đây chỉ cần đúng một việc là "cho tôi N byte ngẫu nhiên an toàn", và bề mặt
# API của nó ổn định hơn hẳn các bản rand gần đây.
getrandom = { version = "0.4", features = ["std"] }
# Tải gói plugin/service cài từ bên ngoài (src/artifact_installer.rs). Pin đúng "0.12" vì
# đó là bản `tauri-plugin-http` đã kéo vào transitively (workspace đã có sẵn
# reqwest 0.12.28 đã build) — dùng chung để không compile thêm một bản reqwest
# thứ hai. Tải THẲNG bằng reqwest, không qua `tauri-plugin-http`'s JS binding:
# gói plugin có thể vài MB, và JSON/IPC không phải đường đúng cho payload lớn
# (base64 hoá tốn thêm ~33%) — Rust tải trực tiếp xuống đĩa, JS chỉ nhận lại
# kết quả (đường dẫn cục bộ, hash).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Thin LTO + parallel codegen units trade a little binary size/runtime perf
# for much faster release builds (fat LTO + codegen-units=1 serializes all
# codegen onto a single thread, which is very slow with heavy async deps
# like tokio/rskafka/axum/lapin in the dependency tree).
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
