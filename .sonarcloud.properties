# SonarCloud automatic analysis settings.
#
# Translation dictionaries are data: every entry has the same shape
# (`key: { vi: '…', en: '…' }`), so copy-paste detection flags any new run of
# entries as duplicated code. Exclude them from duplication only; they are
# still analysed for bugs and code smells.
sonar.cpd.exclusions=src/lib/i18n.ts,src/**/*.messages.ts,src/components/tools/apiclient/i18n.ts
